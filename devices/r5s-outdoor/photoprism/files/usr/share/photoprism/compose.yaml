services:
  photoprism:
    image: ${PHOTOPRISM_IMAGE:?offline image identity required}
    pull_policy: never
    network_mode: host
    restart: "no"
    env_file:
      - /mnt/ssd/PhotoPrism/secrets/photoprism.env
    environment:
      PHOTOPRISM_HTTP_HOST: ${PHOTOPRISM_HTTP_HOST:?validated LAN IPv4 required}
      PHOTOPRISM_HTTP_PORT: ${PHOTOPRISM_HTTP_PORT:-2342}
      PHOTOPRISM_DATABASE_DRIVER: sqlite
      PHOTOPRISM_DISABLE_FACES: "true"
      PHOTOPRISM_DISABLE_CLASSIFICATION: "true"
      PHOTOPRISM_DISABLE_TENSORFLOW: "true"
      PHOTOPRISM_WORKERS: "1"
    volumes:
      - type: bind
        source: /mnt/ssd/PhotoPrism/originals
        target: /photoprism/originals
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/ssd/PhotoPrism/storage
        target: /photoprism/storage
        bind:
          create_host_path: false
